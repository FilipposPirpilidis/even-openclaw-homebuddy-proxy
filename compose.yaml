services:
  telegram-proxy:
    build:
      context: .
    image: even-openclaw-homebuddy-proxy:local
    container_name: even-openclaw-homebuddy-proxy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HA_OFFLINE_CONFIG_PATH: /config/offline_commands.json
    ports:
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${PROXY_PORT:-18989}:8080"
    volumes:
      - telegram-session:/data
      - ./config:/config:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
            'http://127.0.0.1:8080/healthz', timeout=5
          ).read()
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 20s

  telegram-login:
    profiles:
      - login
    build:
      context: .
    image: even-openclaw-homebuddy-proxy:local
    env_file:
      - .env
    command:
      - python
      - -m
      - app.telegram_login
    volumes:
      - telegram-session:/data
    stdin_open: true
    tty: true

volumes:
  telegram-session:

